<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Hour AI ecommerce product visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee783"/>
      <stop offset="1" stop-color="#08b9d8"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff7a1f"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162033"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#16304a" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="190" fill="#dff8ef" opacity=".55" filter="url(#soft)"/>
  <circle cx="180" cy="690" r="210" fill="#e4f0ff" opacity=".75" filter="url(#soft)"/>
  <g opacity=".28" stroke="#b9cadc" stroke-width="2">
    <path d="M120 160H1080M120 660H1080M220 90V730M980 90V730"/>
  </g>
