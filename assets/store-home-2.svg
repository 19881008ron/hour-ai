    <ellipse cx="600" cy="655" rx="310" ry="40" fill="#dbe6ef"/>
    <rect x="380" y="265" width="260" height="280" rx="42" fill="#182234"/><rect x="650" y="330" width="160" height="190" rx="30" fill="#d9a83f"/><path d="M420 210h175l38 70H382z" fill="#f2d189"/><path d="M685 405h90" stroke="#fff7db" stroke-width="16" stroke-linecap="round"/>
    
  </g>
